<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electricity Meter Reading</title>
<style>
  :root { --navy:#1f3a5f; --navy-d:#162c48; --bg:#f3f5f8; --line:#d5dbe3; --text:#1c2733; --muted:#5b6776;
          --ok-bg:#e8f3ec; --ok:#1d6b3a; --err-bg:#fbeaea; --err:#a12626; --warn-bg:#fff4dc; --warn:#8a5a00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .who { font-size:14px; display:flex; align-items:center; gap:12px; }
  main { max-width:560px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:20px; margin-bottom:20px; }
  h2 { font-size:16px; margin:0 0 14px; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input, select, textarea { width:100%; padding:10px 12px; font:inherit; border:1px solid #b9c2ce; border-radius:4px; background:#fff; color:var(--text); }
  input:focus, select:focus, textarea:focus { outline:2px solid #8fa8c8; border-color:var(--navy); }
  textarea { resize:vertical; min-height:60px; }
  button { font:inherit; font-weight:600; border:0; border-radius:4px; padding:11px 18px; cursor:pointer; background:var(--navy); color:#fff; }
  button:hover:not(:disabled) { background:var(--navy-d); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  button.full { width:100%; margin-top:20px; }
  button.link { background:transparent; border:1px solid rgba(255,255,255,.6); padding:6px 12px; font-weight:500; font-size:14px; }
  .msg { padding:12px 14px; border-radius:4px; margin-top:16px; font-size:15px; }
  .msg.ok  { background:var(--ok-bg);  color:var(--ok);  border:1px solid #b7d9c3; }
  .msg.err { background:var(--err-bg); color:var(--err); border:1px solid #efc1c1; }
  .msg.warn{ background:var(--warn-bg);color:var(--warn);border:1px solid #f0d899; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  td.num, th.num { text-align:right; }
  .tablewrap { overflow-x:auto; }
  .tag { font-size:12px; padding:2px 7px; border-radius:10px; background:#e6ebf2; }
  .tag.flag { background:var(--warn-bg); color:var(--warn); }
  .muted { color:var(--muted); font-size:14px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Electricity Meter Reading</h1>
  <div class="who hidden" id="who"><span id="whoName"></span><button class="link" id="logoutBtn">Log out</button></div>
</header>

<main>
  <!-- LOGIN -->
  <section class="card" id="loginView">
    <h2>Log in</h2>
    <form id="loginForm" autocomplete="on">
      <label for="empId">Employee ID</label>
      <input id="empId" name="username" autocomplete="username" autocapitalize="off" required>
      <label for="pwd">Password</label>
      <input id="pwd" name="password" type="password" autocomplete="current-password" required>
      <button class="full" id="loginBtn" type="submit">Log in</button>
    </form>
    <div id="loginMsg"></div>
  </section>

  <!-- ENTRY -->
  <div id="appView" class="hidden">
    <section class="card">
      <h2>New meter reading</h2>
      <form id="readingForm" novalidate>
        <label for="shop">Shop</label>
        <select id="shop" required></select>
        <label for="reading">Cumulative meter reading</label>
        <input id="reading" inputmode="decimal" autocomplete="off" placeholder="e.g. 10320.5" required>
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" maxlength="500"></textarea>
        <button class="full" id="submitBtn" type="submit">Submit reading</button>
      </form>
      <div id="entryMsg"></div>
      <p class="muted" style="margin:14px 0 0">Date and time are recorded automatically.</p>
    </section>

    <section class="card">
      <h2>My recent submissions</h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Date &amp; time</th><th>Shop</th><th class="num">Reading</th><th class="num">kWh</th><th>Status</th></tr></thead>
          <tbody id="history"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const cfg = window.APP_CONFIG;
  const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  let employee = null;
  let requestId = crypto.randomUUID();      // one id per entry; a retry re-uses it so nothing is saved twice

  const fmtNum = (v) => v === null || v === undefined ? "—" :
    Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
  const fmtTime = (iso) => new Date(iso).toLocaleString("en-GB", { timeZone: "Asia/Karachi",
    day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const show = (el, type, html) => { el.innerHTML = `<div class="msg ${type}">${html}</div>`; };

  function toEmail(id) { return id.trim().toLowerCase() + "@" + cfg.EMAIL_DOMAIN; }

  // ---------- views ----------
  function showLogin() {
    $("loginView").classList.remove("hidden"); $("appView").classList.add("hidden"); $("who").classList.add("hidden");
  }
  async function showApp() {
    $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden"); $("who").classList.remove("hidden");
    $("whoName").textContent = employee.full_name ? `${employee.full_name} (${employee.employee_code})` : employee.employee_code;
    await Promise.all([loadShops(), loadHistory()]);
  }

  // ---------- session ----------
  async function loadEmployee() {
    const { data, error } = await sb.from("employees").select("employee_code, full_name, is_active").maybeSingle();
    if (error || !data || !data.is_active) return null;
    return data;
  }
  async function start() {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      employee = await loadEmployee();
      if (employee) return showApp();
      await sb.auth.signOut();
    }
    showLogin();
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn"); btn.disabled = true; $("loginMsg").innerHTML = "";
    const { error } = await sb.auth.signInWithPassword({ email: toEmail($("empId").value), password: $("pwd").value });
    if (error) {
      btn.disabled = false;
      return show($("loginMsg"), "err", "Login failed. Check your Employee ID and password, or contact the administrator.");
    }
    employee = await loadEmployee();
    btn.disabled = false;
    if (!employee) {
      await sb.auth.signOut();
      return show($("loginMsg"), "err", "This account is not authorized to submit readings. Contact the administrator.");
    }
    $("pwd").value = "";
    showApp();
  });

  $("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut(); employee = null; $("entryMsg").innerHTML = ""; $("loginMsg").innerHTML = ""; showLogin();
  });

  // ---------- data ----------
  async function loadShops() {
    const { data, error } = await sb.from("shops").select("id, name").order("id");
    const sel = $("shop");
    if (error || !data) { sel.innerHTML = ""; return show($("entryMsg"), "err", "Could not load the shop list. Please refresh."); }
    sel.innerHTML = '<option value="">Select shop…</option>' + data.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  }

  async function loadHistory() {
    const { data, error } = await sb.from("meter_readings")
      .select("id, recorded_at, reading, consumption_kwh, status, shops(name)")
      .order("id", { ascending: false }).limit(10);
    const body = $("history");
    if (error) { body.innerHTML = '<tr><td colspan="5" class="muted">Could not load history.</td></tr>'; return; }
    if (!data.length) { body.innerHTML = '<tr><td colspan="5" class="muted">No submissions yet.</td></tr>'; return; }
    body.innerHTML = data.map(r => `<tr>
      <td>${fmtTime(r.recorded_at)}</td><td>${esc(r.shops?.name)}</td>
      <td class="num">${fmtNum(r.reading)}</td><td class="num">${fmtNum(r.consumption_kwh)}</td>
      <td><span class="tag ${r.status === "CHECK RESET" ? "flag" : ""}">${esc(r.status)}</span></td></tr>`).join("");
  }

  // ---------- submit ----------
  $("readingForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("entryMsg"); msg.innerHTML = "";
    const shopId = $("shop").value;
    const raw = $("reading").value.replace(/,/g, "").trim();
    const value = Number(raw);
    if (!shopId) return show(msg, "err", "Please select a shop.");
    if (raw === "" || !Number.isFinite(value) || value < 0) return show(msg, "err", "Enter a valid meter reading (a number, zero or more).");
    const shopName = $("shop").selectedOptions[0].text;
    if (!confirm(`Submit reading ${fmtNum(value)} for ${shopName}?`)) return;

    const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      const { data, error } = await sb.functions.invoke("submit-reading", {
        body: { shop_id: Number(shopId), reading: value, notes: $("notes").value, request_id: requestId },
      });
      let result = data;
      if (error) {                                       // server replied with an error status
        try { result = await error.context.json(); } catch { result = null; }
        if (!result) throw new Error("network");
      }
      if (!result || !result.ok || !result.reading || !result.reading.id) {
        if (result && result.code === "NO_LOGIN") { await sb.auth.signOut(); showLogin(); return show($("loginMsg"), "err", result.message); }
        return show(msg, "err", esc(result?.message || "The reading was NOT saved. Please try again."));
      }
      // Success is shown only after the database has confirmed the saved row
      const r = result.reading;
      let html = `<strong>Saved.</strong> ${esc(result.shop_name)}: ${fmtNum(r.reading)} (entry #${r.id}).`;
      if (r.status === "BASELINE") html += "<br>First reading for this shop — recorded as the baseline.";
      else if (r.status === "CHECK RESET") html += `<br>Reading is lower than the previous reading (${fmtNum(r.previous_reading)}). Flagged <b>CHECK RESET</b> for review.`;
      else html += `<br>Previous: ${fmtNum(r.previous_reading)} &nbsp;|&nbsp; Consumption: <b>${fmtNum(r.consumption_kwh)} kWh</b>`;
      show(msg, r.status === "CHECK RESET" ? "warn" : "ok", html);
      $("reading").value = ""; $("notes").value = ""; $("shop").value = "";
      requestId = crypto.randomUUID();                   // new id for the next entry
      loadHistory();
    } catch (err) {
      // Network failure: we cannot know if it was saved. Same request_id is kept, so retrying is safe.
      show(msg, "err", "Connection problem — the reading may not have been saved. Press Submit again to retry (it will not be saved twice).");
    } finally {
      btn.disabled = false; btn.textContent = "Submit reading";
    }
  });

  start();
})();
</script>
</body>
</html>
